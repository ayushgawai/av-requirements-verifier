[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "av-requirements-verifier"
version = "0.1.0"
description = "Requirement traceability, scenario-log verification and release gating for autonomous-driving software"
requires-python = ">=3.9"
license = {text = "MIT"}
[project.scripts]
avrv = "avrv.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
