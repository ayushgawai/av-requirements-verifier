# Requirement catalog. Fields: id, description, metric, threshold, comparator (gte|lte), agg (min|max|p95|mean), severity, blocking, unit
requirements:
  - id: REQ-001
    description: Minimum following gap to lead vehicle
    metric: min_gap_m
    threshold: 5.0
    comparator: gte
    agg: min
    severity: critical
    blocking: true
    unit: m
  - id: REQ-002
    description: Time-to-collision floor (fleet minimum)
    metric: min_ttc_s
    threshold: 2.5
    comparator: gte
    agg: min
    severity: critical
    blocking: true
    unit: s
  - id: REQ-003
    description: Time-to-collision p95 scenario minimum
    metric: min_ttc_s
    threshold: 4.0
    comparator: gte
    agg: p95
    severity: major
    blocking: false
    unit: s
  - id: REQ-004
    description: Stop-line violations per scenario (max)
    metric: stop_violation
    threshold: 0.0
    comparator: lte
    agg: max
    severity: critical
    blocking: true
    unit: count
  - id: REQ-005
    description: Hard-brake rate (decel < -4 m/s2 fraction)
    metric: hard_brake_rate
    threshold: 0.02
    comparator: lte
    agg: mean
    severity: major
    blocking: true
    unit: fraction
  - id: REQ-006
